services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: passport
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: passport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport -d passport"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://passport:passport@postgres:5432/passport
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://passport:passport@postgres:5432/passport
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
